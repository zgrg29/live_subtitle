# LiveSub の設定ファイルです。変更したらプログラムを再起動してください。
# すべて既定値のままで動きます。マイクや見た目を変えたいときだけ編集してください。

[audio]
# 空欄＝システム既定のマイク。名前の一部を書けば一致するマイクを使います
device = ""
sample_rate = 16000
block_ms = 20
# 入力ゲイン。マイクが小さいときは 1.5〜2.0 に上げます
gain = 1.0

[vad]
threshold = 0.008
noise_ratio = 2.5
# 大きくするほど咳・マイク叩きなどの雑音を弾きます
min_speech_ms = 160
# 無音が何 ms 続いたら発話終了とみなすか。区切りは [segment] の統合が補います
end_silence_ms = 320
max_utterance_s = 8.0
min_utterance_ms = 250
pre_roll_ms = 120

[segment]
# 半文の統合：言い終わっていないように見えるときは表示を保留し、続きと統合します
merge = true
# 続きを最大何 ms 待つか。来なければそのまま表示します
merge_wait_ms = 800
# 最大いくつまで統合するか（1 文が無限に待つのを防ぐ）
max_merge = 2
# 統合後の音声の長さ上限（秒）
max_total_s = 12.0
# 保留の上限。通常は発動しません（画面が空き続けるのを防ぐ保険）
max_hold_ms = 12000
# 前の断片がこれより短いときだけ再認識。長い断片はテキストを連結して ASR を節約
re_asr_under_ms = 2500

[asr]
engine = "auto"
# モデル置き場。python -m livesub download で取得できます
model_dir = "models/sherpa-ja"
# CPU スレッド数。x264 のソフトウェアエンコード配信では 1〜2 を推奨
num_threads = 2
# 先頭に少し無音を足して、最初の短い語が飲まれるのを防ぎます。通常は変更不要
lead_pad_ms = 200
fallback_to_mock = true

[mt]
# opus=既定（75M ONNX、速くて実用的）| echo=翻訳しない | none=日本語だけ表示
engine = "opus"
model_dir = "models/opus-mt-ja-zh-int8"
num_threads = 2
target_lang = "zh"
max_chars = 40
# 翻訳前に、句読点のない ASR 出力へ文末の句読点を補います（実測 F1 0.456 → 0.504）
punctuate = true
max_new_tokens = 48

[glossary]
# 辞書（定型フレーズ／用語）のスイッチ。オフにするとモデル出力そのまま
enabled = true
# 辞書ディレクトリ（phrases.tsv + terms.tsv）
dir = "glossary"
max_phrase_len = 24

[overlay]
# 日本語の原文も表示するか
bilingual = true
font_family = "\"Microsoft YaHei\", \"Noto Sans SC\", \"PingFang SC\", sans-serif"
# 中国語字幕の文字サイズ(px)。OBS キャンバス 1920x1080 基準
zh_size = 48
ja_size = 26
zh_color = "#FFFFFF"
ja_color = "#B9C6D4"
outline_color = "#000000"
# 縁取りの幅(px)。0 で縁取りなし
outline_width = 4
background = "transparent"
position = "bottom"
margin_percent = 8
max_lines = 2
line_gap = 10
fade_ms = 180

[server]
host = "127.0.0.1"
# OBS のブラウザソースに入力するポート
port = 8765

[debug]
save_wav = false
log_utf8 = true
show_latency_hud = false
